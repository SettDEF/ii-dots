[package]
name = "finance-sync"
version = "0.1.0"
edition = "2021"
description = "Pulls balances and transactions from Enable Banking into a JSON state file for the quickshell sidebar."

[dependencies]
# ureq over reqwest deliberately: this is a small blocking CLI run by a timer,
# and reqwest drags in tokio + hyper for no benefit here.
ureq = { version = "2", features = ["json", "tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "9"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
