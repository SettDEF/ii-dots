<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <!-- Tablet slate with side-firing speaker slots, at list-icon size (24 grid,
       2px stroke). The two short edge slots are what tell it apart from a plain
       screen glyph. currentColor for theme inheritance. -->
  <rect x="4" y="4" width="16" height="14" rx="2"
        stroke="currentColor" stroke-width="2"/>
  <path d="M3 9.5v3M21 9.5v3" stroke="currentColor" stroke-width="2"
        stroke-linecap="round"/>
  <path d="M8 21h8" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
</svg>
