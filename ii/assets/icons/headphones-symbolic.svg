        stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <rect x="2.5" y="13.5" width="4.5" height="7" rx="2.25"
        stroke="currentColor" stroke-width="2"/>
  <rect x="17" y="13.5" width="4.5" height="7" rx="2.25"
        stroke="currentColor" stroke-width="2"/>
</svg>
