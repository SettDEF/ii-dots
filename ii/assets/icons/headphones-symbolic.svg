<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <!-- Over-ear headphones: headband arc plus two earcups. Drawn on the same
       24px grid and 2px stroke as the fluent set so it sits beside those icons
       without looking heavier or lighter. currentColor so it inherits the
       theme role the caller sets, like every other symbolic icon here. -->
