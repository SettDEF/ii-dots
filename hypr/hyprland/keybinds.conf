# Keybinds, for the cheatsheet (Super+/).
#
# This file binds NOTHING. The real binds are Lua, in lua/keybinds.lua — but
# the cheatsheet's parser reads hyprlang, reads only this file and
# custom/keybinds.conf, and does not follow `source =`. So this is a hyprlang
# transcription of the Lua, kept for the cheatsheet to read.
#
# It is a duplicate, and duplicates drift. If you change a binding, change it
# in BOTH files — the only symptom of forgetting is a cheatsheet that quietly
# tells you the wrong key.
#
# Format the parser wants: `#!` marks a section and `##!` nests one deeper —
# depth is the number of `#`, NOT the number of `!`. A trailing `# comment`
# becomes the label. `#/#` documents a key that is not
# really bound here.

#! Shell
bind = Super, Super_L, global, quickshell:searchToggleRelease # Search and launch
bind = Super, Tab, global, quickshell:overviewWorkspacesToggle # Overview
bind = Super, A, global, quickshell:sidebarLeftToggle # Left sidebar
bind = Super, N, global, quickshell:sidebarRightToggle # Right sidebar
bind = Super, M, global, quickshell:mediaControlsToggle # Media controls
bind = Super, Slash, global, quickshell:cheatsheetToggle # This cheatsheet
bind = Super, V, global, quickshell:overviewClipboardToggle # Clipboard history
bind = Super, Period, global, quickshell:overviewEmojiToggle # Emoji picker
bind = Super, Backspace, global, quickshell:shelfToggle # Shelf
bind = Super, J, global, quickshell:barToggle # Show or hide the bar
bind = Super, K, global, quickshell:oskToggle # On-screen keyboard
bind = Super, G, global, quickshell:overlayToggle # Overlay
bind = Super, Y, global, quickshell:panelFamilyCycle # Cycle the panel layout
bind = Super, I, exec, qs -p ~/.config/quickshell/@SHELL_NAME@/settings.qml # Settings
bind = Ctrl+Alt, Delete, global, quickshell:sessionToggle # Session menu
bind = Ctrl+Super, T, global, quickshell:wallpaperSelectorToggle # Wallpapers
bind = Ctrl+Super+Alt, T, global, quickshell:wallpaperSelectorRandom # Random wallpaper
bind = Super+Shift+Alt, Slash, exec, qs -p ~/.config/quickshell/@SHELL_NAME@/welcome.qml # Welcome app

#! Screen
bind = Super+Shift, S, global, quickshell:regionScreenshot # Screenshot a region
bind = Super+Shift, T, global, quickshell:regionOcr # Copy text off the screen
bind = Super+Alt, R, global, quickshell:regionRecord # Record a region

#! Media
bind = Super+Shift, P, exec, playerctl play-pause # Play or pause
bind = Super+Shift, N, global, quickshell:playerSkipNext # Next track
bind = Super+Shift, B, global, quickshell:playerSkipPrev # Previous track
bind = Super, bracketright, global, quickshell:playerNext # Next player
bind = Super, bracketleft, global, quickshell:playerPrev # Previous player
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_SINK@ toggle # Mute
bind = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_SOURCE@ toggle # Mute the microphone

#! Windows
bind = Super, Q, killactive, # Close the window
bind = Super, T, exec, foot # Terminal
bind = Super, E, exec, xdg-open ~ # Files
bind = Super, F, fullscreen, 0 # Fullscreen
bind = Super, D, fullscreen, 1 # Maximize
bind = Super+Shift, F, togglefloating, # Float
bind = Super, P, pin, # Pin to every workspace
bind = Super, L, global, quickshell:lock # Lock the screen

##! Focus
bind = Super, Left, movefocus, l # Focus left
bind = Super, Right, movefocus, r # Focus right
bind = Super, Up, movefocus, u # Focus up
bind = Super, Down, movefocus, d # Focus down

##! Move
bind = Super+Shift, Left, movewindow, l # Move left
bind = Super+Shift, Right, movewindow, r # Move right
bind = Super+Shift, Up, movewindow, u # Move up
bind = Super+Shift, Down, movewindow, d # Move down
bind = Super, semicolon, splitratio, -0.1 # Shrink
bind = Super, apostrophe, splitratio, +0.1 # Grow
#/# bind = Super, mouse:272, # Hold to drag a window
#/# bind = Super, mouse:273, # Hold to resize a window

#! Workspaces
bind = Super, 1, workspace, 1 # Go to workspace 1-10
bind = Super+Shift, 1, movetoworkspace, 1 # Move the window to workspace 1-10
bind = Super, Page_Down, workspace, +1 # Next workspace
bind = Super, Page_Up, workspace, -1 # Previous workspace
bind = Super, grave, togglespecialworkspace, # Scratchpad
bind = Super+Shift, grave, movetoworkspacesilent, special # Send to the scratchpad
